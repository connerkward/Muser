<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muser</title>
  </head>
  <body>
    <header>
      <h1>muser</h1>
      <nav class="tabs">
        <button class="nav on" data-mode="text" type="button">Search</button>
        <button class="nav" data-mode="color" type="button">Color</button>
        <button class="nav" data-mode="image" type="button" title="Drop or pick an image to find visually similar images in your library">Reverse image</button>
      </nav>
      <span class="sp"></span>
      <input id="scope" class="scope" type="search" list="folders" placeholder="all folders" autocomplete="off"
             title="Scope to a folder (any indexed path prefix)" />
      <datalist id="folders"></datalist>
      <button id="fsToggle" class="fsbtn" type="button" title="Fullscreen" aria-pressed="false">
        <span class="fs-on">⤢</span><span class="fs-off">⤡</span>
      </button>
    </header>

    <!-- Text-search panel -->
    <form id="form" class="panel bar" data-panel="text">
      <input id="q" type="search" placeholder="Describe the image you're looking for…" autocomplete="off" />
      <button id="go" class="primary" type="submit">Search</button>
    </form>

    <!-- Color-search panel -->
    <div class="panel bar" data-panel="color" hidden>
      <input id="colorPicker" type="color" value="#c83c3c" title="Pick a color to add" />
      <span class="swatches" id="colorPresets"></span>
      <button id="colorAdd" type="button">Add</button>
      <button id="colorGo" class="primary" type="button">Search by color</button>
      <button id="colorClear" type="button" class="ghost">Clear</button>
    </div>
    <div class="csset" id="colorSet" hidden></div>

    <!-- Reverse-image panel: pick or drag-drop an image → visually similar library results -->
    <div class="panel bar" data-panel="image" hidden>
      <label class="filebtn" for="imgFile">Choose image…</label>
      <input id="imgFile" type="file" accept="image/*" />
      <span class="mut" id="imgName">Reverse image search — drag an image onto the gallery, or pick one, to find visually similar images in your library.</span>
    </div>

    <!-- Blend (aesthetic re-rank) control — populated by gallery.ts. A compact
         allocation bar over Relevance + 5 aesthetic models; re-ranks the current
         results client-side by a weighted sum of the per-result scores. -->
    <div id="blend" class="blend" hidden></div>

    <div id="status">Connecting…</div>

    <!-- Drag-and-drop reverse-image search target: dropping an image file anywhere
         over the gallery runs a reverse-image search on it. -->
    <div id="dropzone" class="dropzone">
      <div class="dz-inner">Drop image to reverse-search your library</div>
    </div>

    <div id="grid"></div>

    <div class="modal" id="dupes">
      <div class="box">
        <span class="x" id="dupesClose">✕</span>
        <h3 id="dupesTitle"></h3>
        <div class="sub" id="dupesSub"></div>
        <div class="files" id="dupesFiles"></div>
      </div>
    </div>

    <!-- Fullscreen image lightbox (whole image, click-outside / Esc to close) -->
    <div class="lightbox" id="lightbox">
      <span class="x" id="lightboxClose">✕</span>
      <img id="lightboxImg" alt="" />
      <div class="cap" id="lightboxCap"></div>
    </div>
    <script type="module" src="./search-app.ts"></script>
  </body>
</html>
