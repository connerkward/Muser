[project]
name = "muser"
version = "0.1.0"
description = "Local-first semantic image search with a 2026 retrieval stack and a built-in evaluation harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.52,<5",
    "sentence-transformers>=3.4",
    "pillow>=10.4",
    "numpy>=1.26",
    "lancedb>=0.14",
    "pyarrow>=17.0",
    "ranx>=0.3.20",
    "typer>=0.12",
    "rich>=13.7",
    "datasets>=3.2",
    "huggingface-hub>=0.27",
    "tqdm>=4.66",
    "gradio>=5.9",
    "peft>=0.19.1",
    "torchvision>=0.27.0",
    "einops>=0.8.2",
    "timm>=1.0.27",
    "adjusttext>=1.3.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "mcp[cli]>=1.27.2",
    "imagehash>=4.3.2",
    "pdqhash>=0.2.8",
]

[project.scripts]
muser = "muser.cli:app"
muser-mcp = "muser.mcp:main"

[project.optional-dependencies]
mac = [
    "mlx>=0.31.2",
    "mlx-lm>=0.29.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muser"]
artifacts = ["muser/web/*.html"]

[tool.uv]
# Pin a Python with mature torch/transformers wheels (3.14 has no torch wheels yet).
