<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Muser — semantic image search</title>
<link rel="icon" type="image/svg+xml" href="/favicon.ico" />
<style>
  :root {
    --bg:#f5f1e8; --paper:#ece6d6; --fg:#1a1815; --mut:#7c7569; --line:#d6cebb;
    --serif: ui-serif, "Iowan Old Style", "Charter", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16140f; --paper:#1f1c16; --fg:#ece6d6; --mut:#80796b; --line:#2b2820; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 var(--sans);
         -webkit-font-smoothing:antialiased; }

  header { display:flex; align-items:baseline; gap:22px; padding:18px 28px 16px;
           border-bottom:1px solid var(--line); }
  header h1 { font:italic 400 22px/1 var(--serif); margin:0; letter-spacing:-.01em;
              text-transform:lowercase; }
  header .sp { flex:1; }

  .nav { background:transparent; border:0; padding:2px 0; color:var(--mut);
         font-size:13px; cursor:pointer; border-bottom:1px solid transparent; }
  .nav:hover { color:var(--fg); }
  .nav.on { color:var(--fg); border-bottom-color:var(--fg); }

  .mut { color:var(--mut); font-size:12px; }

  input, select, button { font:inherit; color:var(--fg); background:transparent;
         border:1px solid var(--line); padding:9px 12px; outline:none; border-radius:2px; }
  input:focus, select:focus { border-color:var(--fg); }
  button { cursor:pointer; }
  button.primary { background:var(--fg); color:var(--bg); border-color:var(--fg);
                   padding-left:18px; padding-right:18px; }
  button.primary:hover { opacity:.85; }

  .wrap { max-width:1280px; margin:0 auto; padding:30px 28px 80px; }

  .searchbar { position:relative; display:flex; gap:8px; margin-bottom:6px; }
  .searchbar input { flex:1; font-size:15px; padding:11px 14px; }
  .searchbar .neg { flex:0 1 230px; }
  .searchbar .neg::placeholder { color:var(--mut); }

  .chips { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px;
           margin:14px 0 22px; min-height:20px; }
  .chips .lbl { color:var(--mut); font-size:10px; letter-spacing:.08em;
                text-transform:uppercase; margin-right:2px; }
  .chip { background:transparent; border:0; padding:0; color:var(--mut);
          font-size:13px; cursor:pointer; border-bottom:1px solid transparent; }
  .chip:hover { color:var(--fg); border-bottom-color:var(--fg); }
  .chip.refine::before { content:"→ "; color:var(--mut); }

  .tools { display:flex; align-items:center; gap:18px; margin:0 0 22px;
           font-size:12px; color:var(--mut); }
  .tools button { background:transparent; border:0; padding:0; color:var(--mut);
                  font-size:12px; cursor:pointer; border-bottom:1px solid transparent; }
  .tools button:hover { color:var(--fg); border-bottom-color:var(--fg); }

  .upload { background:transparent; border:0; padding:0; color:var(--fg);
            font-size:13px; cursor:pointer; border-bottom:1px solid var(--fg); }
  .upload:hover { opacity:.7; }

  .spinner { width:10px; height:10px; border:1.5px solid var(--line);
             border-top-color:var(--fg); border-radius:50%;
             animation:spin .9s linear infinite; display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
          gap:34px 16px; }
  .card { background:transparent; border:0; display:flex; flex-direction:column; }
  .card .thumb { position:relative; aspect-ratio:1; background:var(--paper);
                 cursor:zoom-in; overflow:hidden; }
  .card .thumb img { width:100%; height:100%; object-fit:cover; }
  .dupe { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.72); color:#fff;
          font-size:10px; padding:2px 7px; border:0; cursor:pointer; }
  .scoreb { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.72); color:#fff;
            font-size:10px; padding:2px 7px; border:0; font-variant-numeric:tabular-nums; }
  .card .meta { padding:9px 0 0; }
  .card .name { font-size:12px; color:var(--mut); white-space:nowrap;
                overflow:hidden; text-overflow:ellipsis; }
  /* Card action row:
     The primary action (Add) reads at rest — fg color, dotted underline — so a
     new user sees that it's clickable without hovering. The four secondary
     actions (Similar · Lens · TinEye · Reveal) sit beside it as a single quiet,
     dot-separated strip; they read as one group instead of four floating
     labels, with underline-on-hover still confirming each is a button. Score
     moved onto the thumb (top-left `.scoreb`), matching the Interesting/Review
     views and freeing the foot row for actions only. */
  .card .foot { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
                padding:6px 0 0; font-size:11px; row-gap:6px; }
  .card .foot button { background:transparent; border:0; padding:0; color:var(--mut);
                       font:inherit; cursor:pointer; border-bottom:1px solid transparent; }
  .card .foot button:hover { color:var(--fg); border-bottom-color:var(--fg); }
  /* Primary action (Add): visible at rest. */
  .card .foot button.add { color:var(--fg);
                           border-bottom:1px dotted var(--mut); }
  .card .foot button.add:hover { border-bottom-style:solid; border-bottom-color:var(--fg); }
  .card .foot button.add.added { border-bottom-style:solid; border-bottom-color:var(--fg); }
  /* Secondary cluster: read as one group, separated by middle dots, divided
     from the primary by a thin rule. */
  .card .foot .more { display:flex; align-items:center; gap:8px; color:var(--mut);
                      flex-wrap:wrap; row-gap:4px; }
  .card .foot .more::before { content:""; width:1px; height:11px;
                              background:var(--line); margin:0 2px; }
  .card .foot .more > * + *::before { content:"·"; color:var(--line); margin-right:8px; }
  .card .bar { display:none; }
  .copied { color:var(--fg) !important; border-bottom-color:var(--fg) !important; }
  .cart-actions { display:flex; gap:18px; margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
  .cart-actions button { background:transparent; border:0; padding:0; color:var(--mut);
                         font-size:13px; cursor:pointer; border-bottom:1px solid transparent; }
  .cart-actions button:hover { color:var(--fg); border-bottom-color:var(--fg); }
  .cart-actions button#cartDownload { color:var(--fg); border-bottom-color:var(--fg); }
  .cart-actions button#cartDownload:hover { opacity:.7; }

  .empty { color:var(--mut); text-align:center; padding:90px 0;
           font:italic 400 15px/1.4 var(--serif); }

  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
           background:var(--fg); color:var(--bg); padding:7px 14px; font-size:12px;
           opacity:0; transition:.2s; }
  .toast.show { opacity:1; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
           align-items:center; justify-content:center; z-index:20; padding:16px; }
  .modal.show { display:flex; }
  .modal .box { background:var(--bg); max-width:980px; width:100%; max-height:86vh;
                overflow:auto; padding:26px 28px; border:1px solid var(--line); }
  .modal h3 { margin:0; font:italic 400 19px/1.2 var(--serif); }
  .modal .x { float:right; cursor:pointer; color:var(--mut); font-size:20px; line-height:1; }
  .modal .files { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
                  gap:24px 14px; margin-top:18px; }
  .modal .file { background:transparent; border:0; display:flex; flex-direction:column; }
  .modal .file img { width:100%; aspect-ratio:1; object-fit:cover; cursor:zoom-in;
                     background:var(--paper); }
  .modal .file .fn { font-size:10px; color:var(--mut); padding:6px 0;
                     word-break:break-all; flex:1; }
  .modal .file .frow { display:flex; gap:13px; padding:2px 0 0; }
  .modal .file .frow button { background:transparent; border:0; padding:0; color:var(--mut);
                              font-size:11px; cursor:pointer; border-bottom:1px solid transparent; }
  .modal .file .frow button:hover { color:var(--fg); border-bottom-color:var(--fg); }

  body.has-query .chip::before { content:"+ "; color:var(--mut); }
  body.has-query .chip.refine::before { content:"→ "; }

  .cluster { cursor:pointer; background:transparent; border:0; padding:0; text-align:left;
             display:flex; flex-direction:column; }
  .cluster .mos { display:grid; grid-template-columns:1fr 1fr; gap:1px; aspect-ratio:1;
                  background:var(--paper); }
  .cluster .mos img { width:100%; height:100%; object-fit:cover; }
  .cluster .lab { font-size:13px; color:var(--fg); padding:9px 0 0;
                  text-transform:capitalize; border-bottom:1px solid transparent;
                  align-self:flex-start; }
  .cluster:hover .lab { border-bottom-color:var(--fg); }
  .cluster .sub { font:italic 400 12px/1.4 var(--serif); color:var(--mut); padding:3px 0 0;
                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cluster .cnt { font-size:11px; color:var(--mut); padding:3px 0 0;
                  font-variant-numeric:tabular-nums; }
  #cback { margin-bottom:8px; background:transparent; border:0; padding:0; color:var(--mut);
           font-size:12px; cursor:pointer; }
  #cback:hover { color:var(--fg); }
</style>
</head>
<body>
<header>
  <h1>Muser</h1>
  <button class="nav on" id="navSearch">Search</button>
  <button class="nav" id="navExplore">Explore</button>
  <button class="nav" id="navInteresting">Interesting</button>
  <button class="nav" id="navReview">Review</button>
  <span class="mut" id="status">…</span>
  <span class="sp"></span>
  <span class="spinner" id="spinner" style="display:none" title="Working…"></span>
  <button class="upload" id="cartOpen" style="display:none" title="Open selection">Cart (<span id="cartN">0</span>)</button>
  <button class="upload" id="indexPick" title="Pick a folder and index it">Index folder</button>
  <span class="mut">model</span>
  <select id="model"></select>
</header>

<div class="wrap" id="searchView">
  <div class="searchbar">
    <input id="q" placeholder="Describe what you're looking for — e.g. “a person on a snowy mountain”" autocomplete="off" autofocus />
    <input id="neg" class="neg" placeholder="Exclude (concept to push away from)…" title="Subtracted from the query vector — CLIP can't read 'not X' in the main box; this field does it as embedding-space arithmetic" autocomplete="off" />
    <button class="primary" id="go">Search</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="row tools">
    <span>Scope:</span>
    <button id="scopePick" title="Limit search to a folder"><span id="scopeLabel">All folders</span></button>
    <button id="scopeClear" title="Clear scope" style="display:none">×</button>
    <span class="mut" id="scopemsg"></span>
    <span style="flex:1"></span>
    <span class="mut" id="idxmsg"></span>
    <input type="hidden" id="scope" />
  </div>
  <div id="results" class="grid"></div>
  <div id="empty" class="empty">Index a folder, then search it.</div>
</div>

<div class="wrap" id="exploreView" style="display:none">
  <div class="row" style="margin-bottom:14px">
    <span class="mut">clustering</span>
    <select id="cmethod"><option value="hdbscan">HDBSCAN (auto count)</option><option value="kmeans">K-means</option></select>
    <span class="mut" id="cmsg"></span>
  </div>
  <div class="grid" id="clusterGrid"></div>
  <div id="clusterDetail" style="display:none">
    <button id="cback">← back to clusters</button>
    <h3 id="cdtitle" style="margin:14px 0 2px;text-transform:capitalize"></h3>
    <div class="mut" id="cdsub"></div>
    <div class="grid" id="cdgrid" style="margin-top:16px"></div>
  </div>
</div>

<div class="wrap" id="interestingView" style="display:none">
  <div class="row" style="margin-bottom:14px">
    <span class="mut">rank by</span>
    <select id="imetric">
      <option value="interesting">Interesting (novelty + aesthetic)</option>
      <option value="novelty">Novelty (most unusual / rare)</option>
      <option value="aesthetic">Aesthetic (striking)</option>
    </select>
    <span class="mut" id="imsg"></span>
  </div>
  <div class="grid" id="scoreGrid"></div>
</div>

<div class="wrap" id="reviewView" style="display:none">
  <div class="row" style="margin-bottom:6px">
    <span class="mut">flag</span>
    <select id="rcat">
      <option value="nsfw">NSFW / explicit</option>
      <option value="private">Private / leak (IDs, logins, messages)</option>
    </select>
    <span class="mut" id="rmsg"></span>
  </div>
  <div style="font-size:11px;color:#caa468;margin-bottom:14px">⚠︎ Heuristic zero-shot flags for reviewing your <i>own</i> library — not a classifier or a verdict. Highest-scoring first; skim and decide.</div>
  <div class="grid" id="reviewGrid"></div>
</div>

<div class="modal" id="cartModal"><div class="box">
  <span class="x" id="cartClose">×</span>
  <h3>Selection</h3>
  <div class="sub" id="cartSub"></div>
  <div class="files" id="cartFiles"></div>
  <div class="cart-actions">
    <button id="cartDownload">Download zip</button>
    <button id="cartClear">Clear</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<div class="modal" id="dupes"><div class="box">
  <span class="x" id="dupesClose">✕</span>
  <h3 id="dupesTitle"></h3><div class="mut" id="dupesSub"></div>
  <div class="files" id="dupesFiles"></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }

// Global spinner: any fetch in flight > 300ms lights up the header indicator.
// Covers model-switch (~10–25s), folder indexing, slow searches. Fast warm
// searches (~30ms) finish before the timer fires, so the spinner stays calm.
let _inflight=0, _spinT=null;
const _origFetch = window.fetch.bind(window);
window.fetch = (...args) => {
  _inflight++;
  clearTimeout(_spinT);
  _spinT = setTimeout(()=>{ if(_inflight>0) document.getElementById("spinner").style.display=""; }, 300);
  const done = () => {
    _inflight = Math.max(0, _inflight-1);
    if(_inflight===0){ clearTimeout(_spinT); const sp=document.getElementById("spinner"); if(sp) sp.style.display="none"; }
  };
  return _origFetch(...args).finally(done);
};

// ---- selection cart: accumulate picks across searches, download as a zip,
// clear on download or tab close. sessionStorage (not localStorage) gives us
// the "end of session" semantics for free.
const CART_KEY = "muser-cart";
const _cart = new Set(JSON.parse(sessionStorage.getItem(CART_KEY) || "[]"));
function saveCart(){ sessionStorage.setItem(CART_KEY, JSON.stringify([..._cart])); updateCartUI(); }
function cartHas(p){ return _cart.has(p); }
function cartToggle(p, btn){
  if (_cart.has(p)) { _cart.delete(p); btn.textContent = "+ Add";   btn.classList.remove("added"); }
  else              { _cart.add(p);    btn.textContent = "× Added"; btn.classList.add("added"); }
  saveCart();
}
function updateCartUI(){
  const n = _cart.size;
  $("#cartN").textContent = n;
  $("#cartOpen").style.display = n > 0 ? "" : "none";
}
function syncCartButtons(){
  document.querySelectorAll(".card .foot .add").forEach(b => {
    const p = b.dataset.path;
    if (!p) return;
    const on = _cart.has(p);
    b.textContent = on ? "× Added" : "+ Add";
    b.classList.toggle("added", on);
  });
}
function openCart(){
  $("#cartSub").textContent = _cart.size === 1 ? "1 item" : `${_cart.size} items`;
  const f = $("#cartFiles"); f.innerHTML = "";
  [..._cart].forEach(p => {
    const d = document.createElement("div"); d.className = "file";
    d.innerHTML = `<img loading="lazy" src="/api/thumb?path=${enc(p)}" title="${p}"><div class="fn">${p}</div><div class="frow"><button class="rev">Reveal</button><button class="rem">Remove</button></div>`;
    d.querySelector("img").onclick = () => window.open(`/api/image?path=${enc(p)}`, "_blank");
    d.querySelector(".rev").onclick = async () => { await fetch("/api/reveal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:p})}); toast("revealed in Finder"); };
    d.querySelector(".rem").onclick = () => { _cart.delete(p); saveCart(); openCart(); syncCartButtons(); };
    f.appendChild(d);
  });
  $("#cartModal").classList.add("show");
}
async function downloadCart(){
  if (!_cart.size) return;
  const res = await fetch("/api/zip", {
    method: "POST", headers: {"content-type": "application/json"},
    body: JSON.stringify({paths: [..._cart]}),
  });
  if (!res.ok) { toast("zip failed"); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "muser-cart.zip"; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  _cart.clear(); saveCart(); syncCartButtons();
  $("#cartModal").classList.remove("show");
  toast("Downloaded — cart cleared");
}
$("#cartOpen").onclick = openCart;
$("#cartClose").onclick = () => $("#cartModal").classList.remove("show");
$("#cartModal").onclick = (e) => { if (e.target === $("#cartModal")) $("#cartModal").classList.remove("show"); };
$("#cartDownload").onclick = downloadCart;
$("#cartClear").onclick = () => { _cart.clear(); saveCart(); syncCartButtons(); $("#cartModal").classList.remove("show"); toast("Cart cleared"); };
updateCartUI();

// ---- reverse-image search: copy the image to the clipboard, open Google Lens, ⌘V.
// $0 (consumer Lens, not the paid Vision API). Nothing leaves the machine until the
// user pastes. Promise-form ClipboardItem keeps the click's user-activation across the
// async fetch (required by Safari; works in Chrome). Clipboard images must be PNG.
async function blobToPng(blob){
  if(blob.type==="image/png") return blob;
  const bmp=await createImageBitmap(blob);   // decodes jpg/webp/gif(first frame)/etc.
  const cv=document.createElement("canvas"); cv.width=bmp.width; cv.height=bmp.height;
  cv.getContext("2d").drawImage(bmp,0,0);
  const png=await new Promise(r=>cv.toBlob(r,"image/png"));
  if(!png||!png.size) throw new Error("could not render PNG");
  return png;
}
// Copy the image to the clipboard, flash a "✓ Copied" pop on the button, then open a
// reverse-image engine in a new tab where the user pastes (⌘V). Used for two engines:
//   • Lens  — "where does this appear" / visually-similar (lens.google.com)
//   • TinEye — provenance: sort by "Oldest" → earliest crawled copy ≈ original source.
//     (TinEye's crawl date is the earliest IT indexed, not provably the first post — the
//     true origin can be deleted/uncrawled/offline. Best available proxy, not a guarantee.)
async function engineSearch(path, btn, url, hint){
  const orig = btn && btn.textContent;
  try{
    if(btn) btn.disabled=true;
    const png=await blobToPng(await (await fetch(`/api/image?path=${enc(path)}`)).blob());
    await navigator.clipboard.write([new ClipboardItem({"image/png":png})]);
    if(btn){ btn.textContent="✓ Copied"; btn.classList.add("copied"); }
    toast(hint);
    await new Promise(r=>setTimeout(r,600));        // let the "copied" pop play before the tab steals focus
    window.open(url,"_blank");
  }catch(e){ toast("copy failed: "+e.message); }
  finally{
    if(btn) setTimeout(()=>{ btn.textContent=orig; btn.classList.remove("copied"); btn.disabled=false; }, 1100);
  }
}
const lensSearch   =(path,btn)=>engineSearch(path,btn,"https://lens.google.com/","press ⌘V in the Lens tab");
const originSearch =(path,btn)=>engineSearch(path,btn,"https://tineye.com/","press ⌘V, then sort by “Oldest” for the earliest copy");

async function status(){
  const s = await (await fetch("/api/status")).json();
  $("#status").textContent = `${s.indexed.toLocaleString()} indexed · ${s.db}`;
  const sel=$("#model"); sel.innerHTML="";
  s.models.forEach(m=>{ const o=document.createElement("option"); o.value=o.textContent=m; if(m===s.model)o.selected=true; sel.appendChild(o); });
}
$("#model").onchange = async e => {
  toast("switching model…");
  await fetch("/api/model",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:e.target.value})});
  await status(); toast("model ready");
};

// ---- folder scope: limit search to images under one indexed directory ----
let folderCounts = {};   // folder path -> image count, for the scope readout
async function loadFolders(){
  try{
    const r = await (await fetch("/api/folders")).json();
    folderCounts = {};
    r.folders.forEach(f=>{ folderCounts[f.folder]=f.count; });
  }catch(e){}
}
async function pickFolder(kind){
  const r = await (await fetch(`/api/pick-folder?kind=${kind}`,{method:"POST"})).json();
  return r.cancelled ? null : r.path;
}
function setScope(p){
  $("#scope").value = p || "";
  $("#scopeLabel").textContent = p ? p.split("/").slice(-2).join("/") || p : "All folders";
  $("#scopeClear").style.display = p ? "" : "none";
  scopeMsg();
  if($("#q").value.trim().length >= 2) liveSearch();
}
function scopeMsg(){
  const f=$("#scope").value.trim();
  if(!f){ $("#scopemsg").textContent=""; return; }
  const n=folderCounts[f];
  $("#scopemsg").textContent = n!=null ? `↳ ${n.toLocaleString()} images in scope` : "↳ scoped (re-search to apply)";
}
$("#scopePick").onclick = async()=>{ const p = await pickFolder("scope"); if(p) setScope(p); };
$("#scopeClear").onclick = ()=> setScope("");

const K_STEP=120;                                  // results fetched per page; infinite scroll pulls another K_STEP deeper
const SCROLL_BUFFER=1500;                           // px below the viewport to prefetch the next page, ahead of the user
let _searchAbort=null, _searchTimer=null, _k=K_STEP, _lastKey="", _mode="text";
let _rendered=0, _loading=false, _hasMore=true, _io=null;
function liveSearch(){ clearTimeout(_searchTimer); _searchTimer=setTimeout(search, 180); }
function loadMore(){ if(_loading || !_hasMore || _mode!=="text") return; _k += K_STEP; search(); }
function maybeLoadMore(){                           // trigger the next page while the sentinel is within the buffer zone
  const s=document.getElementById("sentinel");
  if(s && s.getBoundingClientRect().top < innerHeight + SCROLL_BUFFER) loadMore();
}
function ensureSentinel(){                          // a 1px marker kept just below the grid; observed for prefetch
  let s=document.getElementById("sentinel");
  if(!s){
    s=document.createElement("div"); s.id="sentinel"; s.setAttribute("aria-hidden","true");
    _io=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) maybeLoadMore(); },
                                 { rootMargin:`0px 0px ${SCROLL_BUFFER}px 0px` });
    _io.observe(s);
  }
  $("#results").after(s);                          // re-anchor below the grid as it grows
}
async function search(){
  const q=$("#q").value.trim();
  if(q.length < 2){ $("#results").innerHTML=""; $("#empty").style.display="none"; _lastKey=""; _rendered=0; return; }
  $("#empty").style.display="none";
  const folder=$("#scope").value.trim();
  const neg=$("#neg").value.trim();
  const key=q+"|"+folder+"|"+neg;
  if(key!==_lastKey){ _k=K_STEP; _lastKey=key; _rendered=0; _hasMore=true; $("#results").innerHTML=""; }  // new query → reset + clear
  _mode="text"; _loading=true;
  if(_searchAbort) _searchAbort.abort();
  _searchAbort = new AbortController();
  let r;
  try { r = await (await fetch(`/api/search?q=${enc(q)}&k=${_k}${folder?`&folder=${enc(folder)}`:""}${neg?`&neg=${enc(neg)}`:""}`, {signal:_searchAbort.signal})).json(); }
  catch(e){ if(e.name==="AbortError") return; _loading=false; throw e; }   // abort: a newer search now owns _loading
  _renderHits(r);
  _loading=false;
  maybeLoadMore();                                 // short page / tall window: keep filling until the buffer is satisfied
}

function _renderHits(r){
  const g=$("#results");
  if(!r.results.length){
    g.innerHTML="";
    $("#empty").style.display="block";
    $("#empty").textContent = $("#scope").value.trim()
      ? "No matches in this folder — try clearing the scope (✕) to search everywhere."
      : "No matches — is this folder indexed with the current model?";
    _hasMore=false; renderRefinements([]); return;
  }
  _hasMore = _mode==="text" && r.results.length >= _k;   // a full page back ⇒ more are ranked below
  r.results.slice(_rendered).forEach(h=>{                // append only the newly-fetched tail (kNN prefix is stable)
    const conf = h.prob ?? h.score;                       // calibrated P(match) when the model provides it, else raw cosine
    const pct=Math.max(0,Math.min(100,Math.round(conf*100)));
    const scoreTitle = h.prob!=null ? "match probability (SigLIP-calibrated)" : "cosine similarity";
    const dupes=h.dupe_count||1;
    const badge = dupes>1 ? `<span class="dupe" title="${dupes} copies — click to see all">${dupes} copies</span>` : "";
    const c=document.createElement("div"); c.className="card";
    c.innerHTML=`
      <div class="thumb"><span class="scoreb" title="${scoreTitle}">${pct}</span>${badge}<img loading="lazy" src="/api/thumb?path=${enc(h.path)}" title="${h.name}"></div>
      <div class="meta"><div class="name" title="${h.path}">${h.name}</div>
        <div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="foot">
        <button class="add" data-path="${h.path.replace(/"/g, '&quot;')}" title="Add to selection (session cart)">${cartHas(h.path) ? "× Added" : "+ Add"}</button>
        <span class="more">
          <button class="sim" title="Find images visually similar to this one">Similar</button>
          <button class="lens" title="Copy image + open Google Lens (⌘V to search where it appears)">Lens</button>
          <button class="orig" title="Copy image + open TinEye (⌘V, sort Oldest = earliest known copy)">TinEye</button>
          <button class="reveal" title="Reveal in Finder">Reveal</button>
        </span></div>`;
    c.querySelector(".thumb").onclick=()=>window.open(`/api/image?path=${enc(h.path)}`,"_blank");
    { const btn = c.querySelector(".add"); if (cartHas(h.path)) btn.classList.add("added");
      btn.onclick = () => cartToggle(h.path, btn); }
    c.querySelector(".sim").onclick=()=>searchImage(h.path);
    c.querySelector(".lens").onclick=e=>lensSearch(h.path,e.currentTarget);
    c.querySelector(".orig").onclick=e=>originSearch(h.path,e.currentTarget);
    c.querySelector(".reveal").onclick=async()=>{ await fetch("/api/reveal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:h.path})}); toast("revealed in Finder"); };
    if(dupes>1) c.querySelector(".dupe").onclick=e=>{ e.stopPropagation(); openDupes(h); };
    g.appendChild(c);
  });
  _rendered = r.results.length;
  ensureSentinel();
  renderRefinements(r.refinements || []);
}

async function searchImage(path){
  if(_searchAbort) _searchAbort.abort();
  _searchAbort = new AbortController();
  $("#empty").style.display="none";
  $("#q").value = ""; $("#neg").value = "";
  toast(`Searching by image: ${path.split("/").pop()}`);
  _mode="image"; _lastKey=""; _rendered=0; _hasMore=false; $("#results").innerHTML="";   // image-similar: fixed top-N, no scroll-load
  let r;
  try { r = await (await fetch(`/api/search-image?path=${enc(path)}&k=120`, {signal:_searchAbort.signal})).json(); }
  catch(e){ if(e.name==="AbortError") return; throw e; }
  _renderHits(r);
}

// applyQuery: if the query box is empty, replace; if it's non-empty, append.
// Lets chips act as drill-down filters on the current query
// instead of always starting over.
function applyQuery(text){
  const cur = $("#q").value.trim();
  $("#q").value = cur ? cur + " " + text : text;
  document.body.classList.add("has-query");
  clearTimeout(_searchTimer);
  search();
}

// ---- chips: cluster discovery (no query) + post-search refinements ----
let _clusterChips = [];
async function loadClusterChips(){
  try {
    const r = await (await fetch("/api/clusters?method=hdbscan")).json();
    if (!r.built || !r.clusters?.length) { renderClusterChips(); return; }
    _clusterChips = r.clusters.filter(c=>c.id !== -1)
      .sort((a,b)=>b.size - a.size).slice(0, 12).map(c => ({label: c.label, size: c.size}));
    renderClusterChips();
  } catch(e){}
}
function renderClusterChips(){
  const el = $("#chips"); el.innerHTML = "";
  if (!_clusterChips.length) return;
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = "in this library:";
  el.appendChild(lbl);
  _clusterChips.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c.label;
    b.title = `${c.size.toLocaleString()} images in this cluster — click to search`;
    b.onclick = () => applyQuery(c.label);
    el.appendChild(b);
  });
}
function renderRefinements(refs){
  if (!refs.length) { renderClusterChips(); return; }
  const el = $("#chips"); el.innerHTML = "";
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = "you might also try:";
  el.appendChild(lbl);
  refs.forEach(r => {
    const b = document.createElement("button");
    b.className = "chip refine"; b.textContent = r.label;
    b.title = `${r.count} of the top results live in this cluster`;
    b.onclick = () => applyQuery(r.label);
    el.appendChild(b);
  });
}

// ---- autocomplete: nearest cluster labels to the typed query ----
$("#go").onclick = search;
$("#q").addEventListener("input", ()=>{
  document.body.classList.toggle("has-query", $("#q").value.trim().length > 0);
  liveSearch();
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter") { clearTimeout(_searchTimer); search(); }
});
$("#neg").addEventListener("input",   ()=>{ if($("#q").value.trim().length >= 2) liveSearch(); });
$("#neg").addEventListener("keydown", e=>{ if(e.key==="Enter"){ clearTimeout(_searchTimer); search(); } });

function openDupes(h){
  $("#dupesTitle").textContent = h.name;
  $("#dupesSub").textContent = `${h.dupe_count} files are this same image`;
  const f=$("#dupesFiles"); f.innerHTML="";
  h.dupes.forEach(p=>{
    const d=document.createElement("div"); d.className="file";
    d.innerHTML=`<img loading="lazy" src="/api/thumb?path=${enc(p)}" title="${p}"><div class="fn">${p}</div><div class="frow"><button class="lens">Lens</button><button class="orig">TinEye</button><button class="rev">Reveal</button></div>`;
    d.querySelector("img").onclick=()=>window.open(`/api/image?path=${enc(p)}`,"_blank");
    d.querySelector(".lens").onclick=e=>lensSearch(p,e.currentTarget);
    d.querySelector(".orig").onclick=e=>originSearch(p,e.currentTarget);
    d.querySelector(".rev").onclick=async()=>{ await fetch("/api/reveal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:p})}); toast("revealed in Finder"); };
    f.appendChild(d);
  });
  $("#dupes").classList.add("show");
}
$("#dupesClose").onclick=()=>$("#dupes").classList.remove("show");
$("#dupes").onclick=e=>{ if(e.target.id==="dupes") $("#dupes").classList.remove("show"); };

// ---- view switching (Search / Explore / Interesting / Review) ----
const VIEWS={search:"searchView",explore:"exploreView",interesting:"interestingView",review:"reviewView"};
const NAVS={search:"navSearch",explore:"navExplore",interesting:"navInteresting",review:"navReview"};
function showView(v){
  for(const k in VIEWS) $("#"+VIEWS[k]).style.display = k===v?"":"none";
  for(const k in NAVS) $("#"+NAVS[k]).className="nav"+(k===v?" on":"");
  if(v==="explore" && !$("#clusterGrid").children.length) loadClusters();
  if(v==="interesting") loadScores("#scoreGrid","#imsg","#imetric");
  if(v==="review") loadScores("#reviewGrid","#rmsg","#rcat");
}
for(const k in NAVS) $("#"+NAVS[k]).onclick=()=>showView(k);

async function loadScores(gridSel,msgSel,metricSel){
  const metric=$(metricSel).value;
  $(msgSel).textContent="loading…";
  const r=await (await fetch(`/api/score?metric=${metric}&order=desc&limit=140`)).json();
  const g=$(gridSel); g.innerHTML="";
  if(!r.built){ $(msgSel).textContent="Not built yet — run:  muser score"; return; }
  $(msgSel).textContent=`${r.total.toLocaleString()} images · sorted by ${metric} (highest first)`;
  r.items.forEach(h=>{
    const dupe = (h.dupe_count||1)>1 ? `<span class="dupe" title="${h.dupe_count} copies">${h.dupe_count} copies</span>` : "";
    const c=document.createElement("div"); c.className="card";
    c.innerHTML=`<div class="thumb"><span class="scoreb">${Math.round(h.score*100)}</span>${dupe}<img loading="lazy" src="/api/thumb?path=${enc(h.path)}"></div>
      <div class="meta"><div class="name" title="${h.path}">${h.name}</div></div>
      <div class="foot"><button class="lens" title="Copy image + open Google Lens (⌘V to search where it appears)">Lens</button>
        <button class="orig" title="Copy image + open TinEye (⌘V, sort Oldest = earliest known copy)">TinEye</button></div>`;
    c.querySelector(".thumb").onclick=()=>window.open(`/api/image?path=${enc(h.path)}`,"_blank");
    c.querySelector(".lens").onclick=e=>lensSearch(h.path,e.currentTarget);
    c.querySelector(".orig").onclick=e=>originSearch(h.path,e.currentTarget);
    if((h.dupe_count||1)>1) c.querySelector(".dupe").onclick=e=>{ e.stopPropagation(); openDupes(h); };
    g.appendChild(c);
  });
}
$("#imetric").onchange=()=>loadScores("#scoreGrid","#imsg","#imetric");
$("#rcat").onchange=()=>loadScores("#reviewGrid","#rmsg","#rcat");
$("#cmethod").onchange=()=>loadClusters();
$("#cback").onclick=()=>{ $("#clusterDetail").style.display="none"; $("#clusterGrid").style.display=""; };

async function loadClusters(){
  const method=$("#cmethod").value;
  $("#clusterDetail").style.display="none"; $("#clusterGrid").style.display="";
  $("#cmsg").textContent="loading…";
  const r=await (await fetch(`/api/clusters?method=${method}`)).json();
  const g=$("#clusterGrid"); g.innerHTML="";
  if(!r.built){ $("#cmsg").textContent="Not built yet — run:  muser cluster"; return; }
  $("#cmsg").textContent=`${r.clusters.length} clusters · ${r.n.toLocaleString()} images`;
  r.clusters.forEach(c=>{
    const mos=c.reps.slice(0,4).map(p=>`<img loading="lazy" src="/api/thumb?path=${enc(p)}">`).join("");
    const card=document.createElement("div"); card.className="card cluster";
    card.innerHTML=`<div class="mos">${mos}</div><div class="lab">${c.label}</div>
      <div class="sub" title="${c.sublabel}">${c.sublabel}</div><div class="cnt">${c.size.toLocaleString()} images</div>`;
    card.onclick=()=>openCluster(method,c.id,c.label,c.sublabel,c.size);
    g.appendChild(card);
  });
}
async function openCluster(method,id,label,sub,size){
  $("#clusterGrid").style.display="none"; $("#clusterDetail").style.display="";
  $("#cdtitle").textContent=label; $("#cdsub").textContent=`${sub} · ${size.toLocaleString()} images`;
  const r=await (await fetch(`/api/cluster?method=${method}&id=${id}&limit=160`)).json();
  const g=$("#cdgrid"); g.innerHTML="";
  r.members.forEach(h=>{
    const c=document.createElement("div"); c.className="card";
    c.innerHTML=`<div class="thumb"><img loading="lazy" src="/api/thumb?path=${enc(h.path)}"></div>
      <div class="meta"><div class="name" title="${h.path}">${h.name}</div></div>`;
    c.querySelector(".thumb").onclick=()=>window.open(`/api/image?path=${enc(h.path)}`,"_blank");
    g.appendChild(c);
  });
}

$("#indexPick").onclick=async()=>{
  const folder = await pickFolder("index"); if(!folder) return;
  $("#idxmsg").textContent=`indexing ${folder.split("/").slice(-2).join("/")}… (first run loads the model)`;
  try{
    const r=await (await fetch("/api/index",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({folder})})).json();
    $("#idxmsg").textContent=`+${r.added} added · ${r.updated} updated · ${r.total} total`;
    await status(); await loadFolders();
  }catch(e){ $("#idxmsg").textContent="index failed (check path)"; }
};

status(); loadFolders(); loadClusterChips();
</script>
