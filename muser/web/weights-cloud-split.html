<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weighted word-cloud — split find / exclude</title>
<style>
  :root{ --bg:#f4efe3; --fg:#1a1813; --mut:#8a8270; --line:#d8d0bd;
         --pos:#2f7d52; --neg:#b4452f; --serif:'Iowan Old Style',Georgia,serif; --mono:ui-monospace,'SF Mono',Menlo,monospace; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--serif);
        -webkit-font-smoothing:antialiased; padding:30px clamp(16px,5vw,60px) 60px; }
  h1{ font-size:20px; font-weight:600; margin:0 0 3px; }
  .sub{ color:var(--mut); font-size:13px; margin-bottom:20px; max-width:74ch; }
  .sub code{ font:12px var(--mono); background:#0001; padding:1px 4px; }
  .sub b.gp{ color:var(--pos); } .sub b.gn{ color:var(--neg); }

  .zone{ position:relative; display:flex; align-items:baseline; flex-wrap:wrap; gap:3px 16px; min-height:56px;
         padding:12px 14px 12px 64px; border:1px solid var(--line); background:#fffc; cursor:text; line-height:1.25; }
  .zone+.zone{ border-top:0; }
  .zone:focus-within{ border-color:var(--zc); }
  .zone.p{ --zc:var(--pos); } .zone.n{ --zc:var(--neg); }
  .zone .tag{ position:absolute; left:14px; top:14px; font-size:9px; letter-spacing:.09em; text-transform:uppercase; color:var(--zc); }
  .zone.n{ background:#b4452f08; }

  .word{ position:relative; color:var(--zc); cursor:ns-resize; user-select:none; touch-action:none;
         white-space:nowrap; transition:font-size .04s linear, opacity .1s; padding-top:3px; }
  .word .cw{ font:10px var(--mono); color:var(--mut); vertical-align:super; margin-left:2px; }
  .word .rm{ position:absolute; top:-9px; right:-11px; width:16px; height:16px; line-height:14px; text-align:center;
             font:13px/14px var(--mono); color:var(--fg); background:var(--bg); border:1px solid var(--fg);
             border-radius:50%; cursor:pointer; opacity:0; transition:opacity .1s,color .1s,background .1s,border-color .1s; }
  .word:hover .rm{ opacity:1; } .word .rm:hover{ color:#fff; background:var(--neg); border-color:var(--neg); }
  .word.drag{ opacity:.7; }
  .entry{ flex:1; min-width:120px; border:0; outline:0; background:none; font:17px var(--serif); color:var(--fg); align-self:center; padding:4px 2px; }
  .empty{ color:var(--mut); font-style:italic; font-size:13px; align-self:center; }

  .qline{ font:12.5px var(--mono); margin:18px 2px 4px; } .qline b{ color:var(--mut); font-style:italic; font-family:var(--serif); margin-right:6px; }
  .meta{ color:var(--mut); font-size:12px; }
  .results{ display:grid; grid-template-columns:repeat(auto-fill,minmax(116px,1fr)); gap:8px; margin-top:16px; }
  .results .c{ aspect-ratio:1; background:#0001; overflow:hidden; position:relative; }
  .results img{ width:100%; height:100%; object-fit:cover; display:block; }
  .results .s{ position:absolute; top:4px; left:4px; background:#000a; color:#fff; font:10px var(--mono); padding:1px 5px; }
</style></head><body>
<h1>Weighted word-cloud — split find / exclude</h1>
<div class="sub">Same cloud, two zones: type what to <b class="gp">find</b> in the top bar, what to <b class="gn">exclude</b> in the bottom.
Each word starts at <b>100%</b>; drag it <b>down</b> to de-emphasize. <code>,</code>/<code>Enter</code> adds, <code>×</code> or
<code>Backspace</code> removes. Polarity is fixed by the bar — no toggling.</div>

<div class="zone p" id="zoneP" data-s="1"><span class="tag">Find</span><input class="entry" id="entryP" placeholder="type what to find…" autocomplete="off" spellcheck="false"></div>
<div class="zone n" id="zoneN" data-s="-1"><span class="tag">Exclude</span><input class="entry" id="entryN" placeholder="type what to push away…" autocomplete="off" spellcheck="false"></div>

<div class="qline"><b>query →</b><span id="qstr"></span> <span class="meta" id="status"></span></div>
<div class="results" id="results"></div>

<script>
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let POS=[], NEG=[];   // each [{t,w}]  w 0..1 (=0–100%), default 1; drag-down only

function buildQuery(){
  const part=(arr,sign)=>arr.filter(c=>c.w>0.04).map(c=>`${sign}${c.t}${Math.abs(c.w-1)<0.04?"":":"+c.w.toFixed(2)}`);
  return [...part(POS,""), ...part(NEG,"-")].join(", ");
}
function refresh(){ $("#qstr").textContent=buildQuery()||"(empty)"; scheduleSearch(); }

function renderZone(zone, arr, entry){
  [...zone.querySelectorAll(".word, .empty")].forEach(n=>n.remove());
  if(!arr.length){ const e=document.createElement("span"); e.className="empty"; e.textContent=""; }
  arr.forEach((c,i)=>{
    const wd=document.createElement("span"); wd.className="word";
    wd.innerHTML=`${c.t}<span class="cw"></span><span class="rm" title="remove">×</span>`;
    const cw=wd.querySelector(".cw");
    const paint=()=>{ wd.style.fontSize=clamp(15+c.w*15,15,30)+"px"; wd.style.opacity=clamp(.5+c.w*.5,.4,1);
      cw.textContent=Math.round(c.w*100)+"%"; };
    paint();
    let st=null;
    wd.addEventListener("pointerdown",e=>{ if(e.target.classList.contains("rm"))return;
      st={y:e.clientY,w0:c.w,moved:false}; wd.setPointerCapture(e.pointerId); e.preventDefault(); });
    wd.addEventListener("pointermove",e=>{ if(!st)return; const dy=e.clientY-st.y;
      if(Math.abs(dy)>3){ st.moved=true; wd.classList.add("drag"); }
      c.w=clamp(st.w0-dy*0.007,0,1); paint(); refresh(); });   // 100% max, drag down to reduce
    wd.addEventListener("pointerup",()=>{ st=null; wd.classList.remove("drag"); });
    wd.querySelector(".rm").addEventListener("click",e=>{ e.stopPropagation(); arr.splice(i,1); renderZone(zone,arr,entry); refresh(); });
    zone.insertBefore(wd, entry);
  });
  refresh();
}
function render(){ renderZone($("#zoneP"),POS,$("#entryP")); renderZone($("#zoneN"),NEG,$("#entryN")); }

function wire(entryId, arr, zone){
  const entry=$("#"+entryId);
  const commit=()=>{ let v=entry.value.trim(); if(v[0]==="-"||v[0]==="+")v=v.slice(1).trim();
    if(v){ arr.push({t:v.toLowerCase(),w:1}); } entry.value=""; render(); };
  entry.addEventListener("keydown",e=>{
    if(e.key===","||e.key==="Enter"){ e.preventDefault(); commit(); }
    else if(e.key==="Backspace" && !entry.value && arr.length){ arr.pop(); render(); refresh(); } });
  zone.addEventListener("click",e=>{ if(e.target===zone||e.target.classList.contains("tag")) entry.focus(); });
}
wire("entryP",POS,$("#zoneP")); wire("entryN",NEG,$("#zoneN"));

let _t=null; function scheduleSearch(){ clearTimeout(_t); _t=setTimeout(runSearch,250); }
async function runSearch(){
  const q=buildQuery(); if(!q){ $("#results").innerHTML=""; $("#status").textContent=""; return; }
  $("#status").textContent="· searching…";
  try{ const r=await (await fetch(`/api/search?q=${encodeURIComponent(q)}&k=24`)).json();
    const g=$("#results"); g.innerHTML="";
    (r.results||[]).forEach(h=>{ const c=document.createElement("div"); c.className="c";
      const pct=Math.round((h.prob??h.score)*100);
      c.innerHTML=`<span class="s">${pct}</span><img loading="lazy" src="/api/thumb?path=${encodeURIComponent(h.path)}&size=240">`; g.appendChild(c); });
    $("#status").textContent=`· ${(r.results||[]).length} results`;
  }catch(e){ $("#status").textContent="· error: "+e.message; }
}
["car","snow","sunset"].forEach(t=>POS.push({t,w:1})); NEG.push({t:"person",w:1});
render();
</script></body></html>
